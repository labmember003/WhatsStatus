apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.google.android.gms.oss-licenses-plugin'
apply plugin: 'kotlinx-serialization'

android {
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.geeksoftapps.whatsweb.app"
        minSdkVersion 22
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        dataBinding true
        buildConfig true
    }

    kotlinOptions {
        jvmTarget = "1.8"
        freeCompilerArgs += ["-opt-in=kotlin.RequiresOptIn"]
    }
    flavorDimensions "version"
    productFlavors {
        whatsweb {
            dimension "version"
            applicationId "com.geeksoftapps.whatsweb.app"
        }
        whatswebscan {
            dimension "version"
            applicationId "com.geeksoftapps.whatsweb.app"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'com.geeksoftapps.whatsweb.app'
}

dependencies {
    implementation project(':status')
    implementation project(':commons')
    implementation project(':ratingdialog')

    implementation 'androidx.annotation:annotation:1.2.0'
    implementation "androidx.appcompat:appcompat:$appcompat_version"
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation "com.google.android.material:material:$material_version"
    implementation "androidx.preference:preference-ktx:$androidx_preference_version"
    implementation 'androidx.gridlayout:gridlayout:1.0.0'

    implementation "com.google.android.play:app-update:2.1.0"
    implementation "com.squareup.okhttp3:okhttp:4.9.3"
    implementation "com.hbb20:ccp:$ccp_version"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.1.0"

    implementation platform("com.google.firebase:firebase-bom:$firebase_bom_version")
    implementation 'com.google.firebase:firebase-crashlytics-ktx'
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-config-ktx'

    implementation "com.github.permissions-dispatcher:permissionsdispatcher:$permissionsdispatcher_version"
    kapt "com.github.permissions-dispatcher:permissionsdispatcher-processor:$permissionsdispatcher_version"

    kapt "com.github.bumptech.glide:compiler:$glide_version"
    implementation "com.airbnb.android:lottie:$lottie_version"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
}
