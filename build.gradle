// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '1.9.24'
    ext.gradle_version = '8.5.0'
    
    // Core versions
    ext.kodein_version = "6.5.5"
    ext.lifecycle_version = "2.6.2"
    ext.arch_version = "2.1.0"
    ext.permissionsdispatcher_version = "4.9.1"
    ext.glide_version = "4.16.0"
    ext.threetenabp_version = "1.2.1"
    ext.osslicense_plugin_version = "0.10.6"
    ext.osslicense_version = "17.0.1"
    ext.material_version = "1.11.0"
    ext.power_preference_version = "2.1.0"
    ext.inapp_billing_version = '6.0.1'
    ext.touch_image_view_version = '2.3.2'
    ext.ccp_version = '2.5.0'
    ext.androidx_preference_version = '1.2.1'
    ext.gms_version = '4.4.1'
    ext.crashlytics_project_version = '3.0.1'
    ext.facebook_audience_network_version = '6.17.0'
    ext.exoplayer_version = '2.19.1'
    ext.coroutines_version = '1.7.3'
    ext.appcompat_version = '1.6.1'
    ext.firebase_bom_version = '32.8.1'
    ext.core_ktx_version = '1.13.0'
    ext.lottie_version = '6.4.0'

    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url 'https://android-sdk.is.com/' }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$gradle_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.android.gms:oss-licenses-plugin:$osslicense_plugin_version"
        classpath "com.google.gms:google-services:$gms_version"
        classpath "com.google.firebase:firebase-crashlytics-gradle:$crashlytics_project_version"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url 'https://android-sdk.is.com/' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
